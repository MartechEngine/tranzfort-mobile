name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------------------------------
      # STEP 1: Build Landing Page (Only if you have a 'landing' folder)
      # ---------------------------------------------------------
      - name: Install and Build Landing
        working-directory: ./landing
        run: |
          npm install
          npm run build
        env:
          # We map the keys you saved (VITE_...) to what Next.js needs (NEXT_PUBLIC_...)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ---------------------------------------------------------
      # STEP 2: Build Admin App (Inside 'admin' folder)
      # ---------------------------------------------------------
      - name: Install and Build Admin
        working-directory: ./admin
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ---------------------------------------------------------
      # STEP 3: Merge them into one folder for Hostinger
      # ---------------------------------------------------------
      - name: Prepare Deployment Directory
        run: |
          mkdir deploy-dist
          
          # Copy Landing page to the root of the site
          cp -r landing/out/* deploy-dist/
          
          # Copy Admin app to the /admin subfolder
          mkdir -p deploy-dist/admin
          cp -r admin/out/* deploy-dist/admin/

      # ---------------------------------------------------------
      # STEP 4: Upload to Hostinger
      # ---------------------------------------------------------
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-dist/
          server-dir: ./
          protocol: ftp
          dangerous-clean-slate: true