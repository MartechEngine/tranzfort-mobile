name: Deploy to Hostinger and Supabase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Supabase Schema
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
        if: success()

      - name: Deploy Supabase Functions
        run: |
          supabase functions deploy handle-expiry --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy send-notifications --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 1. Build Landing Page (Root)
      - name: Install and Build Landing
        working-directory: ./landing
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 2. Build Admin App (/admin)
      - name: Install and Build Admin
        working-directory: ./admin
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 3. Prepare deployment directory
      - name: Prepare Deployment Directory
        run: |
          mkdir deploy-dist
          cp -r landing/out/* deploy-dist/
          mkdir -p deploy-dist/admin
          cp -r admin/out/* deploy-dist/admin/

      # 4. Upload to Hostinger (FTP)
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-dist/
          server-dir: ./
          protocol: ftp
          dangerous-clean-slate: true